[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leasegpt"
version = "0.1.0"
description = "CLI-first LeaseGPT runtime for extraction, validation, and downstream lease deliverables."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.67.0",
  "google-genai>=1.30.0",
  "jsonschema>=4.23.0",
  "openai>=1.109.0",
  "openpyxl>=3.1.5",
  "pypdf>=5.9.0",
  "python-docx>=1.2.0",
  "python-dotenv>=1.1.1",
  "pyyaml>=6.0.2",
  "reportlab>=4.4.3",
  "typer>=0.16.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "ruff==0.13.0",
  "mypy==1.18.2",
  "pytest-cov==7.0.0",
]

[project.scripts]
leasegpt = "leasegpt.cli:main"

[tool.setuptools]
packages = ["leasegpt", "leasegpt.providers", "leasegpt.pipeline", "leasegpt.utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = false
no_implicit_optional = true
strict_equality = true


[tool.coverage.run]
source = ["leasegpt/pipeline", "leasegpt/cli.py"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 60
