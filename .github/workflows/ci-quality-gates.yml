name: CI Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gates:
    name: quality-gates (format/lint/type/tests/eval)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Static analysis (ruff + mypy)
        run: ./scripts/static_analysis.sh

      - name: Dependency integrity check
        run: python -m pip check

      - name: Unit tests + coverage gate
        run: pytest -q --cov=leasegpt.pipeline --cov=leasegpt.cli --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Eval fixtures check
        run: pytest -q tests/test_eval.py

      - name: Required docs policy check
        run: python scripts/check_required_docs.py

      - name: Generate validation artifacts
        run: |
          mkdir -p .tmp/ci-artifacts/quality-gates
          python -m leasegpt.cli eval .claude/skills/lease-eval/fixtures/golden_ol_a1/lease_state.json \
            --output-report .tmp/ci-artifacts/quality-gates/conformance_report.json \
            --output-summary .tmp/ci-artifacts/quality-gates/conformance_summary.md
          python -m leasegpt.cli diff .claude/skills/lease-eval/fixtures/golden_ol_a1/lease_state.json \
            --output-report .tmp/ci-artifacts/quality-gates/diff_report.md \
            --output-manifest .tmp/ci-artifacts/quality-gates/diff_manifest.json

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-validation-artifacts
          path: .tmp/ci-artifacts/quality-gates
          if-no-files-found: error
          retention-days: 14

  harness-smoke:
    name: harness-smoke (deterministic offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Dependency integrity check
        run: python -m pip check

      - name: Run harness smoke
        run: ./scripts/harness_smoke.sh

      - name: Upload harness smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harness-smoke-validation-artifacts
          path: .tmp/harness-smoke/offline
          if-no-files-found: error
          retention-days: 14
